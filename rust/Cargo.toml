[package]
name = "kimatta_bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
thiserror = "2"
kimatta-application = { path = "crates/kimatta-application" }
kimatta-storage = { path = "crates/kimatta-storage" }
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[workspace]
members = ["crates/*"]
