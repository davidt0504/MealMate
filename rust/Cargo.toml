[package]
name = "kimatta_bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
thiserror = "2"
kimatta-application = { path = "crates/kimatta-application" }
kimatta-storage = { path = "crates/kimatta-storage" }
recipe-import = { path = "crates/recipe-import" }
# Already in the tree through food-domain: the wording experiment's local file (OPT-007 §10).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
recipe-import = { path = "crates/recipe-import", features = ["test-support"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[workspace]
members = ["crates/*"]
