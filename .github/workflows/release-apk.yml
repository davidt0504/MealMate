name: Publish Android APK

on:
  push:
    branches:
      - master
    # Tag pushes skip these path filters, so every pushed v* tag still publishes.
    paths:
      - ".github/workflows/release-apk.yml"
      - "android/**"
      - "assets/**"
      - "flutter_rust_bridge.yaml"
      - "hook/**"
      - "lib/**"
      - "pubspec.lock"
      - "pubspec.yaml"
      - "rust/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# One build at a time; a newer push replaces a still-pending run. Never cancel a running
# build: stopped mid-publish, it leaves a release with no APK and the README link 404s.
concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.98.0"
      SIGNING_CERT_SHA256: f0d663498fb06a14a79e87f7ef090dbd6b6a697dbf1d815ae42cbb291dcfffe3

    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust and Android targets
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # The Flutter native-assets hook invokes `rustup` directly.
      - name: Make Rust tools available to Flutter
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Flutter Rust Bridge code generator
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Verify generated bridge bindings
        run: flutter_rust_bridge_codegen generate

      # Stale .so = false pass, so the Rust build always precedes the tests.
      - name: Run tests
        run: (cd rust && cargo test --workspace && cargo build --release) && flutter test

      # Without the shared key, Gradle generates a fresh debug key per run, and phones refuse
      # the update unless the app (and its local data) is uninstalled first.
      # Installed late to shorten exposure; code from earlier steps in this job can still persist
      # and read it.
      - name: Install the shared signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then
            echo "::error::SIGNING_KEYSTORE_B64 secret is not set"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          # Checked before the build: a wrong secret fails here in seconds, naming both digests.
          env | grep '^ANDROID' || true
          set -o pipefail
          actual=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android \
            | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f') || {
            echo "::error::keytool could not read the keystore decoded from SIGNING_KEYSTORE_B64"
            exit 1
          }
          if [ "$actual" != "$SIGNING_CERT_SHA256" ]; then
            echo "::error::SIGNING_KEYSTORE_B64 decodes to certificate '${actual}', expected ${SIGNING_CERT_SHA256}"
            exit 1
          fi

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Verify the APK carries the shared signing key
        shell: bash
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk \
            > signers.txt
          cat signers.txt
          if ! grep -q "SHA-256 digest: ${SIGNING_CERT_SHA256}" signers.txt; then
            echo "::error::APK not signed with ${SIGNING_CERT_SHA256} although the installed key matched; the build read another keystore (see the ANDROID_* variables printed by the install step)"
            exit 1
          fi

      - name: Upload APK for publishing
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    # Publishes only from master or a v* tag, and only while the PUBLISH_APK repository variable
    # is 'true' (unset holds releases, e.g. an unapproved migration). Other runs build and verify.
    if: >-
      vars.PUBLISH_APK == 'true' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # Required for `gh release create`; only this job holds it, and it runs no dependency code.
    permissions:
      contents: write

    steps:
      - name: Download the verified APK
        uses: actions/download-artifact@v4
        with:
          name: app-release

      - name: Publish GitHub Release
        env:
          # `gh` uses this token to create the release and upload its asset.
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so `gh` cannot infer the repository.
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: >-
          gh release create "$RELEASE_TAG"
          "app-release.apk#MealMate-${RELEASE_TAG}.apk"
          --target "$GITHUB_SHA"
          --title "MealMate ${RELEASE_TAG}"
          --latest
          --generate-notes
