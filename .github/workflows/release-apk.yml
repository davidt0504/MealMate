name: Publish Android APK

on:
  push:
    branches:
      - master
    # Tag pushes skip these path filters, so every pushed v* tag still publishes.
    paths:
      - ".github/workflows/release-apk.yml"
      - "android/**"
      - "assets/**"
      - "flutter_rust_bridge.yaml"
      - "hook/**"
      - "lib/**"
      - "pubspec.lock"
      - "pubspec.yaml"
      - "rust/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# One build at a time; a newer push replaces a still-pending run. Never cancel a running
# build: stopped mid-publish, it leaves a release with no APK and the README link 404s.
concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  # Seconds rather than minutes. A missing secret or variable used to surface only after the
  # test phase, which is how two consecutive runs were spent on one misconfiguration.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest

    steps:
      - name: Check the signing configuration is present
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        run: |
          missing=""
          [ -n "$SIGNING_KEYSTORE_B64" ] || missing="$missing SIGNING_KEYSTORE_B64(secret)"
          [ -n "$SIGNING_KEY_PASSWORD" ] || missing="$missing SIGNING_KEY_PASSWORD(secret)"
          [ -n "$SIGNING_CERT_SHA256" ] || missing="$missing SIGNING_CERT_SHA256(variable)"
          if [ -n "$missing" ]; then
            echo "::error::not configured:$missing -- see 'Downloading an APK from GitHub' in README.md"
            exit 1
          fi
          echo "signing configuration present"

  build:
    name: Build APK
    needs: preflight
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.98.0"

    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pinned rather than `stable`: an upstream release must not be able to change what a
      # release build compiles against between one run and the next. Matches the local SDK
      # the recorded test counts were produced on.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          cache: true

      - name: Set up Rust and Android targets
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: rustfmt

      # The Flutter native-assets hook invokes `rustup` directly.
      - name: Make Rust tools available to Flutter
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The bridge generator shells out to `cargo expand` and `rustfmt`. Without them it logs
      # an error, skips that work and still exits 0, so the check below would pass on a
      # generator that never really ran.
      - name: Install Flutter Rust Bridge code generator
        run: |
          cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
          cargo install cargo-expand --locked

      - name: Fetch Flutter dependencies
        run: flutter pub get

      # Regenerating is not verifying. The committed bindings must equal what the generator
      # produces, or a stale or hand-edited binding ships unnoticed. Whitespace is ignored: freezed
      # emits whitespace-only lines that editors strip on save, and a stale binding always differs
      # in real code too, so ignoring it loses nothing but the false alarm.
      - name: Verify generated bridge bindings
        run: |
          flutter_rust_bridge_codegen generate
          if ! git diff --exit-code -w --ignore-blank-lines -- lib/src/rust rust/src/frb_generated*.rs; then
            echo "::error::generated bindings differ from the committed ones; run 'flutter_rust_bridge_codegen generate' and commit the result"
            exit 1
          fi

      # Stale .so = false pass, so the Rust build always precedes the tests.
      - name: Run tests
        run: (cd rust && cargo test --workspace && cargo build --release) && flutter test

      # Decoded into the runner temp directory, never ~/.android: the build must read the key
      # it was handed rather than whatever AGP finds on its own search path. Checked before the
      # build, so a wrong key fails in seconds instead of after the APK is assembled.
      - name: Install the release signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        run: |
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          set -o pipefail
          actual=$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$SIGNING_KEY_PASSWORD" \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f') || {
            echo "::error::keytool could not read the keystore decoded from SIGNING_KEYSTORE_B64 -- wrong SIGNING_KEY_PASSWORD, or the secret is not a keystore"
            exit 1
          }
          expected=$(printf '%s' "$SIGNING_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$actual" != "$expected" ]; then
            echo "::error::SIGNING_KEYSTORE_B64 decodes to certificate '${actual}', but SIGNING_CERT_SHA256 expects '${expected}'"
            exit 1
          fi
          echo "signing key matches ${expected}"

      - name: Build universal release APK
        env:
          MEALMATE_KEYSTORE: ${{ runner.temp }}/release.jks
          MEALMATE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          MEALMATE_KEY_ALIAS: mealmate
        run: flutter build apk --release

      - name: Verify the APK carries the release signing key
        shell: bash
        env:
          SIGNING_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        run: |
          expected=$(printf '%s' "$SIGNING_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk \
            > signers.txt
          cat signers.txt
          if ! grep -q "SHA-256 digest: ${expected}" signers.txt; then
            echo "::error::APK not signed with ${expected} although the installed key matched; the release signingConfig did not take effect and the build fell back to a debug key"
            exit 1
          fi

      - name: Upload APK for publishing
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    # Publishes only from master or a v* tag, and only while the PUBLISH_APK repository variable
    # is 'true' (unset holds releases, e.g. an unapproved migration). Other runs build and verify.
    if: >-
      vars.PUBLISH_APK == 'true' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # Required for `gh release create`; only this job holds it, and it runs no dependency code.
    permissions:
      contents: write

    steps:
      - name: Download the verified APK
        uses: actions/download-artifact@v4
        with:
          name: app-release

      - name: Publish GitHub Release
        env:
          # `gh` uses this token to create the release and upload its asset.
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so `gh` cannot infer the repository.
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: >-
          gh release create "$RELEASE_TAG"
          "app-release.apk#MealMate-${RELEASE_TAG}.apk"
          --target "$GITHUB_SHA"
          --title "MealMate ${RELEASE_TAG}"
          --latest
          --generate-notes
