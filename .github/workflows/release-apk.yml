name: Publish Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example v1.0.0)"
        required: true
        type: string

# Required for `gh release create` to publish the APK to this repository.
permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    env:
      # `gh` uses this token to create the release and upload its asset.
      GH_TOKEN: ${{ github.token }}
      RUSTUP_TOOLCHAIN: "1.98.0"

    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust and Android targets
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # The Flutter native-assets hook invokes `rustup` directly.
      - name: Make Rust tools available to Flutter
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Flutter Rust Bridge code generator
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Verify generated bridge bindings
        run: flutter_rust_bridge_codegen generate

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Publish GitHub Release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          "build/app/outputs/flutter-apk/app-release.apk#MealMate-${RELEASE_TAG}.apk"
          --title "MealMate ${RELEASE_TAG}"
          --generate-notes
